[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zells-pipeline"
version = "0.1.0"
description = "Zells scan-to-STL pipeline worker: measurement extraction, Onshape CAD generation, STL export."
requires-python = ">=3.12"
dependencies = [
  "fastapi~=0.115",
  "uvicorn~=0.32",
  "trimesh~=4.5",
  "numpy~=2.1",
  "scipy~=1.14",
  "httpx~=0.27",
  "pydantic~=2.9",
  "pydantic-settings~=2.6",
  "psycopg[binary]~=3.2",
  "jsonschema~=4.23",
  "tenacity~=9.0",
  # Optional trimesh dependency required for planar cross-section polygon
  # handling used by Trimesh.section(); without it, section() can still
  # return a Path3D but polygon-based dimension math on the slice is
  # unreliable.
  "shapely~=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest~=8.3",
  "pytest-asyncio~=0.24",
  "ruff~=0.7",
]

[project.scripts]
zells-extract = "zells_pipeline.extract.cli:run"
zells-retention = "zells_pipeline.jobs.retention:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
