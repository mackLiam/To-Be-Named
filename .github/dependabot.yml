version: 2
updates:
  # GitHub Actions workflow deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Expo pins these per SDK release; bump them with `expo install --fix`
      # during an SDK upgrade, never one at a time.
      - dependency-name: "expo*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /services/pipeline
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
